# CachyOS's stock settings (refreshed from /etc/skel by ~/.local/bin/sync-cachyos-config)
include cachyos.conf

# Noctalia colours (generated by Noctalia's kitty template)
include themes/noctalia.conf

# --- My overrides ---
background_opacity          0.85
dynamic_background_opacity  yes

# Background opacity, single-press (the ctrl+shift+a sequences still work)
map ctrl+alt+up   set_background_opacity +0.05
map ctrl+alt+down set_background_opacity -0.05
map ctrl+alt+0    set_background_opacity default

# Close windows without asking, even if something is running
confirm_os_window_close 0
