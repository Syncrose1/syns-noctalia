config_version = 20

[bar.default]
background_opacity = 0.59999999999999998
border_width = 0.0
capsule_opacity = 1.0
concave_edge_corners = true
end = [ "media", "spacer_1", "tray", "videowall", "notifications", "network", "volume", "session" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.1000000000000001
start = [ "launcher", "clock", "bar" ]
thickness = 35
widget_spacing = 6

    [bar.default.dead_zone.actions]
    scroll_down = "exec @HOME@/.local/bin/bar-scroll down"
    scroll_up = "exec @HOME@/.local/bin/bar-scroll up"

[brightness]
enable_ddcutil = true

[calendar]
