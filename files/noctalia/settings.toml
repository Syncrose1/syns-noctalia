[plugin_settings."noctalia/mpvpaper"]
mpv_options = "panscan=1.0"
video_directory = "@HOME@/Pictures/Wallpapers"

[plugins]
enabled = [ "micahg/nwg-displays", "felipeartur/ai-usagebar", "tadomika_ari/w-engine", "noctalia/mpvpaper" ]

[shell]
font_family = "Inter"
telemetry_enabled = true

    [shell.screenshot]
    copy_to_clipboard = true
    directory = "@HOME@/Pictures/Screenshots"
    pipe_to_command = false
    save_to_file = true

    [shell.session]
    actions = [
        { action = "lock", command = "loginctl lock-session", countdown_seconds = 0.0, enabled = true, shortcut = "1", variant = "default" },
        { action = "logout", countdown_seconds = 0.0, enabled = true, shortcut = "2", variant = "default" },
        { action = "lock_and_suspend", command = "systemctl suspend", countdown_seconds = 3.0, enabled = true, shortcut = "3", variant = "default" },
        { action = "reboot", countdown_seconds = 3.0, enabled = true, shortcut = "4", variant = "default" },
        { action = "shutdown", countdown_seconds = 3.0, enabled = true, shortcut = "5", variant = "destructive" }
    ]

[theme]
builtin = "Rosé Pine"
mode = "dark"
shell_mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]

[wallpaper]
directory = "@HOME@/Pictures/Wallpapers"





[widget.bar]
type = "felipeartur/ai-usagebar:bar"

[widget.clock]
format = "{:%H:%M  ·  %a %d %b}"

[widget.network]
peek = true

[widget.videowall]
type = "noctalia/mpvpaper:mpvpaper"

[widget.volume]
peek = true

[widget.wallpapers]
type = "tadomika_ari/w-engine:w-engine-widget"

[widget.workspaces]
active_pill_size = 2.2000000000000002
capsule = false
pill_scale = 0.59999999999999998