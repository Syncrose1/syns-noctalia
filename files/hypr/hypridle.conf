# hypridle: turns lock requests and sleep into a qylock lock screen.
# Idle timeouts themselves are handled by Noctalia (Settings -> Idle).
general {
    lock_cmd = ~/.local/bin/lock-screen          # loginctl lock-session (Super+L, session menu)
    before_sleep_cmd = loginctl lock-session     # lock before suspend/hibernate
    ignore_dbus_inhibit = false
}
